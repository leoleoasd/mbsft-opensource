[project]
dependencies = [
  "megatron-bridge",
  "megatron-energon",
  "apex",
  "nvidia-modelopt>=0.43.0rc1",
  "transformer-engine @ git+https://github.com/NVIDIA/TransformerEngine.git@287770466f0f4433052260a765db5ff7b8be1320",
  "nvidia-resiliency-ext~=0.6.0",
  "mlflow>=3.5.0",
  "cryptography>=43.0.0,<47",
  "nvidia-modelopt>=0.42.0a0",
  "urllib3>=2.6.3",
  "ray[default]==2.53.0",
]
name = "megatron-bridge-custom"
requires-python = ">=3.12,<3.13"
version = "0.1.0"

[tool.uv]
default-groups = ["build"]
no-build-isolation-package = [
  "transformer-engine",
  "transformer-engine-torch",
  "mamba-ssm",
  "causal-conv1d",
  "nv-grouped-gemm",
  "flash_mla",
  "flash-linear-attention",
  "apex",
]
override-dependencies = [
  "transformers>=5.8.1,<5.9.0",
  "megatron-core @ git+https://github.com/leoleoasd/Megatron-LM.git@sft-patch-v2",
]
prerelease = "allow"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.uv.sources]
apex = {git = "https://github.com/NVIDIA/apex.git", rev = "10417aceddd7d5d05d7cbf7b0fc2daad1105f8b4"}
megatron-bridge = {git = "https://github.com/leoleoasd/Megatron-Bridge.git", branch = "sft-patch-v2"}
megatron-core = {git = "https://github.com/leoleoasd/Megatron-LM.git", branch = "sft-patch-v2"}
nvidia-modelopt = {index = "nvidia"}

[dependency-groups]
build = ["setuptools", "torch", "pybind11", "Cython>=3.0.0", "numpy<2.0.0", "ninja", "nvidia-mathdx", "poetry-core"]
